<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reading Lamp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            background: #0b0e14;
            min-height: 100vh;
        }

        .control-panel {
            max-width: 500px;
            margin: 24px auto;
            background: rgba(22, 26, 35, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 28px 24px 36px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            color: #f0f3ff;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 24px 0 14px 0;
            color: #cfdfff;
            border-left: 4px solid #ff8c42;
            padding-left: 14px;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin: 10px 0 8px;
        }

        .color-option {
            aspect-ratio: 1 / 1;
            border-radius: 28px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.1s ease;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .color-option.selected {
            border-color: white;
            transform: scale(1.05);
            box-shadow: 0 0 0 2px #fff, 0 8px 18px black;
        }

        .color-option.selected::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.4rem;
            font-weight: bold;
            color: rgba(0,0,0,0.45);
        }

        .brightness-slider {
            margin: 16px 0 12px;
        }

        input[type="range"] {
            width: 100%;
            height: 36px;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            border-radius: 10px;
            cursor: pointer;
            touch-action: pan-x;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 10px;
            background: linear-gradient(90deg, #2a2f3f, #ffae70);
        }

        input[type="range"]::-moz-range-track {
            height: 6px;
            border-radius: 10px;
            background: linear-gradient(90deg, #2a2f3f, #ffae70);
        }

        #sleepSlider::-webkit-slider-runnable-track {
            background: linear-gradient(90deg, #1a2a1a, #4caf50);
        }

        #sleepSlider::-moz-range-track {
            background: linear-gradient(90deg, #1a2a1a, #4caf50);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ff8c42;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            margin-top: -11px;
        }

        input[type="range"]::-moz-range-thumb {
            width: 28px;
            height: 28px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ff8c42;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        #sleepSlider::-webkit-slider-thumb {
            border-color: #4caf50;
        }

        #sleepSlider::-moz-range-thumb {
            border-color: #4caf50;
        }

        .brightness-row {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
        }

        .brightness-value {
            background: #1e2538;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #ffcd94;
            font-weight: 500;
        }

        #brightPercent {
            background: #ff8c42;
            color: #1a1a2a;
            font-weight: bold;
        }

        .sleep-slider {
            margin: 16px 0 12px;
        }

        .sleep-row {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
        }

        .sleep-label {
            background: #1e2538;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #a8f0b0;
            font-weight: 500;
        }

        #sleepValue {
            background: #2e7d32;
            color: #e8ffe8;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
        }

        .timer-display {
            position: fixed;
            top: 36px;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border-radius: 60px;
            padding: 10px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #000000;
            z-index: 1011;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .start-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff8c42, #e05e00);
            border: none;
            padding: 20px 12px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 60px;
            color: white;
            margin-top: 32px;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .start-btn:active {
            transform: scale(0.97);
        }

        .info-text {
            text-align: center;
            font-size: 0.75rem;
            color: #9aafdf;
            background: #00000050;
            padding: 10px;
            border-radius: 60px;
            margin-top: 16px;
        }

        .fullscreen-light {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background-color: #ff8c00;
            transition: background-color 0.08s linear;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .fullscreen-light .back-btn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: 2px solid transparent;
            padding: 14px 32px;
            border-radius: 60px;
            color: #000000;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 1010;
            font-family: monospace;
        }

        .hide-panel {
            display: none;
        }

        @media (max-width: 500px) {
            .control-panel {
                margin: 16px;
                padding: 20px 18px;
            }
            .color-option {
                border-radius: 20px;
            }
            .start-btn {
                font-size: 1.5rem;
                padding: 16px;
            }
        }
    </style>
</head>
<body>

<div id="controlPanel" class="control-panel">
    <h1>Reading Lamp <span style="font-size:0.9rem;"></span></h1>

    <h2>Select Color</h2>
    <div class="color-grid" id="colorGrid"></div>

    <h2>Brightness</h2>
    <div class="brightness-slider">
        <input type="range" id="brightnessSlider" min="15" max="100" value="85">
        <div class="brightness-row">
            <span class="brightness-value">Low</span>
            <span class="brightness-value" id="brightPercent">85%</span>
            <span class="brightness-value">High</span>
        </div>
    </div>

    <h2>Sleep Timer</h2>
    <div class="sleep-slider">
        <input type="range" id="sleepSlider" min="0" max="180" value="0" step="1">
        <div class="sleep-row">
            <span class="sleep-label">Off</span>
            <span class="sleep-label" id="sleepValue">No Timer</span>
            <span class="sleep-label">3 hr</span>
        </div>
    </div>

    <button id="startBtn" class="start-btn"> Start &nbsp;▶</button>
    <div class="info-text">
         Created By Sazzad 
    </div>
</div>

<script>
    const colorList = [
        "#FF8C00",
        "#FF6B00",
        "#FF4500",
        "#FFB300",
        "#FFF5E0",
        "#FFD700",
        "#FFE4B5",
        "#FFFACD"
    ];

    let selectedColor = "#FF8C00";
    let brightnessPercent = 85;
    let isFullscreenActive = false;
    let sleepMinutes = 0;
    let sleepTimerInterval = null;
    let sleepSecondsLeft = 0;

    const panel = document.getElementById('controlPanel');
    const colorGrid = document.getElementById('colorGrid');
    const brightnessSlider = document.getElementById('brightnessSlider');
    const brightPercentSpan = document.getElementById('brightPercent');
    const sleepSlider = document.getElementById('sleepSlider');
    const sleepValueSpan = document.getElementById('sleepValue');
    const startBtn = document.getElementById('startBtn');

    function buildColorGrid() {
        colorGrid.innerHTML = '';
        colorList.forEach(hex => {
            const colorDiv = document.createElement('div');
            colorDiv.className = 'color-option';
            colorDiv.style.backgroundColor = hex;
            if (hex === selectedColor) colorDiv.classList.add('selected');

            colorDiv.addEventListener('click', () => {
                document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
                colorDiv.classList.add('selected');
                selectedColor = hex;
                if (isFullscreenActive) {
                    applyBrightnessToFullscreen();
                }
            });
            colorGrid.appendChild(colorDiv);
        });
    }

    function initBrightness() {
        brightnessSlider.value = brightnessPercent;
        brightPercentSpan.innerText = brightnessPercent + '%';
        brightnessSlider.addEventListener('input', (e) => {
            brightnessPercent = parseInt(e.target.value);
            brightPercentSpan.innerText = brightnessPercent + '%';
            if (isFullscreenActive) {
                applyBrightnessToFullscreen();
            }
        });
    }

    function formatSleepLabel(min) {
        if (min === 0) return 'No Timer';
        if (min < 60) return min + ' min';
        const h = Math.floor(min / 60);
        const m = min % 60;
        return m === 0 ? h + ' hr' : h + ' hr ' + m + ' min';
    }

    function formatCountdown(sec) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function initSleepSlider() {
        sleepSlider.value = sleepMinutes;
        sleepValueSpan.innerText = formatSleepLabel(sleepMinutes);
        sleepSlider.addEventListener('input', (e) => {
            sleepMinutes = parseInt(e.target.value);
            sleepValueSpan.innerText = formatSleepLabel(sleepMinutes);
        });
    }

    function startSleepTimer(minutes) {
        clearSleepTimer();
        if (minutes === 0) return;
        sleepSecondsLeft = minutes * 60;

        const overlay = document.getElementById('fullLightOverlay');
        if (!overlay) return;

        let timerEl = document.getElementById('timerDisplay');
        if (!timerEl) {
            timerEl = document.createElement('div');
            timerEl.id = 'timerDisplay';
            timerEl.className = 'timer-display';
            overlay.appendChild(timerEl);
        }
        timerEl.innerText = formatCountdown(sleepSecondsLeft);

        sleepTimerInterval = setInterval(() => {
            sleepSecondsLeft--;
            const el = document.getElementById('timerDisplay');
            if (el) el.innerText = formatCountdown(sleepSecondsLeft);
            if (sleepSecondsLeft <= 0) {
                clearSleepTimer();
                turnOffFullscreen();
            }
        }, 1000);
    }

    function clearSleepTimer() {
        if (sleepTimerInterval) {
            clearInterval(sleepTimerInterval);
            sleepTimerInterval = null;
        }
    }

    function applyBrightnessToHex(hex, percent) {
        let r, g, b;
        if (hex.startsWith('#')) {
            r = parseInt(hex.slice(1, 3), 16);
            g = parseInt(hex.slice(3, 5), 16);
            b = parseInt(hex.slice(5, 7), 16);
        } else {
            return hex;
        }
        const factor = percent / 100;
        let newR = Math.min(255, Math.max(0, Math.floor(r * factor)));
        let newG = Math.min(255, Math.max(0, Math.floor(g * factor)));
        let newB = Math.min(255, Math.max(0, Math.floor(b * factor)));
        return `rgb(${newR}, ${newG}, ${newB})`;
    }

    function applyBrightnessToFullscreen() {
        const overlay = document.getElementById('fullLightOverlay');
        if (overlay && isFullscreenActive) {
            overlay.style.backgroundColor = applyBrightnessToHex(selectedColor, brightnessPercent);
        }
    }

    function showFullscreenLight() {
        if (isFullscreenActive) turnOffFullscreen();

        const overlay = document.createElement('div');
        overlay.id = 'fullLightOverlay';
        overlay.className = 'fullscreen-light';
        overlay.style.backgroundColor = applyBrightnessToHex(selectedColor, brightnessPercent);

        const backButton = document.createElement('button');
        backButton.innerText = 'OFF';
        backButton.className = 'back-btn';
        backButton.addEventListener('click', () => turnOffFullscreen());

        overlay.appendChild(backButton);
        document.body.appendChild(overlay);

        isFullscreenActive = true;
        panel.classList.add('hide-panel');

        startSleepTimer(sleepMinutes);
    }

    function turnOffFullscreen() {
        clearSleepTimer();
        const overlay = document.getElementById('fullLightOverlay');
        if (overlay) overlay.remove();
        isFullscreenActive = false;
        panel.classList.remove('hide-panel');
    }

    function init() {
        buildColorGrid();
        initBrightness();
        initSleepSlider();
        startBtn.addEventListener('click', showFullscreenLight);
    }

    init();
</script>
</body>
</html>
